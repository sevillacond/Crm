version: '3.8'

# ==============================================================================
# ENLACE TELECOM CRM — DOCKER COMPOSE DE IMPLANTAÇÃO
# Instância Isolada (Single-Tenant) por Provedor / CNPJ
# P0 Hardening & PostgreSQL 16 Dedicado (Sem defaults inseguros em produção)
# ==============================================================================

services:
  # Aplicação Core (Frontend SPA + Backend Express + Motor MaIA)
  enlace-crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enlace-telecom-crm
    restart: always
    # P0.7: Em produção atrás de Traefik/Proxy Reverso, a porta 3000 não deve ser exposta publicamente no 0.0.0.0 do host.
    # O bind é restrito a 127.0.0.1 por padrão para desenvolvimento/acesso local seguro.
    ports:
      - "${APP_PORT_BINDING:-127.0.0.1:3000}:3000"
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INSTANCE_ID=${INSTANCE_ID:?INSTANCE_ID é obrigatório para inicializar a instância de produção}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET é obrigatório em produção}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-enlace_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório em produção}@postgres:5432/${POSTGRES_DB:-enlace_crm_db}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS é obrigatório em produção e não pode conter localhost (ex: https://crm.provedor.com.br)}
      - ADMIN_INITIAL_EMAIL=${ADMIN_INITIAL_EMAIL:?ADMIN_INITIAL_EMAIL é obrigatório em produção}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD é obrigatório em produção}
      - PROVIDER_CNPJ=${PROVIDER_CNPJ:?PROVIDER_CNPJ é obrigatório em produção}
      - PROVIDER_RAZAO_SOCIAL=${PROVIDER_RAZAO_SOCIAL:?PROVIDER_RAZAO_SOCIAL é obrigatório em produção}
      - PROVIDER_NOME_FANTASIA=${PROVIDER_NOME_FANTASIA:?PROVIDER_NOME_FANTASIA é obrigatório em produção}
      - PROVIDER_CIDADE=${PROVIDER_CIDADE:?PROVIDER_CIDADE é obrigatório em produção}
      - PROVIDER_UF=${PROVIDER_UF:?PROVIDER_UF é obrigatório em produção}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - SGP_INTEGRACAO=${SGP_INTEGRACAO:-IXC_SOFT}
      - SGP_API_ENDPOINT=${SGP_API_ENDPOINT}
      - SGP_API_TOKEN=${SGP_API_TOKEN}
      - ASTERISK_WEBRTC_WSS=${ASTERISK_WEBRTC_WSS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - enlace-network

  # Banco de Dados Relacional Dedicado (PostgreSQL 16) - Rede Interna Isolada
  postgres:
    image: postgres:16-alpine
    container_name: enlace-postgres-dedicated
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enlace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório em produção}
      POSTGRES_DB: ${POSTGRES_DB:-enlace_crm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enlace_user} -d ${POSTGRES_DB:-enlace_crm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enlace-network

  # Cache de Sessão & Rate Limiting Distribuído (Redis) - Rede Interna Isolada
  redis:
    image: redis:7-alpine
    container_name: enlace-redis-cache
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - enlace-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  enlace-network:
    driver: bridge
